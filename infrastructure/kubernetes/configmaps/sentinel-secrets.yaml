# ============================================================
# Sentinel AI — Secrets (TEMPLATE — replace values in production)
# ============================================================
# In production, use Sealed Secrets, External Secrets, or Vault.
# This template shows the expected key structure.
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
  labels:
    app: sentinel-ai
type: Opaque
data:
  # echo -n 'postgresql+asyncpg://sentinel:PASSWORD@postgres:5432/sentinel' | base64
  DATABASE_URL: "REPLACE_WITH_BASE64_ENCODED_VALUE"

  # echo -n 'your-openai-api-key' | base64
  OPENAI_API_KEY: ""

  # echo -n 'your-anthropic-api-key' | base64
  ANTHROPIC_API_KEY: ""

  # echo -n 'your-github-token' | base64
  GITHUB_TOKEN: ""

  # echo -n 'your-slack-bot-token' | base64
  SLACK_BOT_TOKEN: ""
