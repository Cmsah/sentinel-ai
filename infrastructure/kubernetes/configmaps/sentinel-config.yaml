# ============================================================
# Sentinel AI — Application Configuration
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: sentinel
  labels:
    app: sentinel-ai
data:
  # --- Application ---
  APP_NAME: "sentinel-ai"
  APP_LOG_LEVEL: "INFO"

  # --- Redis ---
  REDIS_HOST: "redis.sentinel.svc.cluster.local"
  REDIS_PORT: "6379"

  # --- Kafka ---
  KAFKA_BOOTSTRAP_SERVERS: "kafka.sentinel.svc.cluster.local:9092"
  KAFKA_CONSUMER_GROUP: "sentinel-ai"

  # --- Observability ---
  OTEL_SERVICE_NAME: "sentinel-ai"
  OTEL_SERVICE_VERSION: "v0.1.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.sentinel.svc.cluster.local:4317"

  # --- MCP ---
  MCP_SERVER_HOST: "0.0.0.0"
  MCP_SERVER_PORT: "9000"

  # --- Prometheus ---
  PROMETHEUS_URL: "http://prometheus.sentinel.svc.cluster.local:9090"

  # --- Features ---
  FEATURE_SIMULATION_MODE: "true"
