[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[FILTER]
    Name         kubernetes
    Match        *
    Merge_Log    On
    Keep_Log     Off

[OUTPUT]
    Name         opensearch
    Match        *
    Host         opensearch
    Port         9200
    Index        sentinel-logs
    Type         _doc
    Logstash_Format On
    Logstash_Prefix sentinel-logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name On
    tls          Off
    tls.verify   Off
